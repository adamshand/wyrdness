<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Wyrdness orb">
  <defs>
    <radialGradient id="bg" cx="50%" cy="44%" r="70%">
      <stop offset="0%" stop-color="#121728"/>
      <stop offset="62%" stop-color="#05060a"/>
      <stop offset="100%" stop-color="#020208"/>
    </radialGradient>
    <radialGradient id="orb" cx="36%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#fff8e7"/>
      <stop offset="24%" stop-color="#ffd27a"/>
      <stop offset="48%" stop-color="#e3465d"/>
      <stop offset="72%" stop-color="#2f8ee8"/>
      <stop offset="100%" stop-color="#0d1833"/>
    </radialGradient>
    <linearGradient id="rim" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e63f53"/>
      <stop offset="32%" stop-color="#f2a23a"/>
      <stop offset="66%" stop-color="#2e87e6"/>
      <stop offset="100%" stop-color="#38c878"/>
