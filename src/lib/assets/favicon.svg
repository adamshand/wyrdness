      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="23" fill="url(#rim)" opacity="0.55" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="20" fill="url(#orb)"/>
  <path d="M18 33c8-8 19-8 28 0" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.34"/>
  <circle cx="25" cy="24" r="7" fill="#fff9ee" opacity="0.72"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.22"/>
</svg>
